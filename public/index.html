
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Gem AI – General Education Mate</title>

<style>
:root {
  --bg:#0b1220;
  --panel:#111c2e;
  --panel2:#17243a;
  --line:#26364e;
  --text:#edf3ff;
  --muted:#9aabc4;
  --accent:#6d8cff;
  --green:#27c99a;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.app {
  max-width:900px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}
header {
  padding:17px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:12px;
}
.logo {
  width:43px;height:43px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#6388ff,#9c6cff);
  border-radius:13px;
  font-size:23px;font-weight:bold;
}
header h2 {margin:0;font-size:19px}
header p {margin:4px 0 0;color:var(--muted);font-size:12px}
.status {
  margin-left:auto;
  color:var(--green);
  font-size:12px;
}
.topics {
  display:flex;gap:9px;
  padding:13px;
  overflow-x:auto;
  background:var(--panel);
}
.topics button,.suggestions button {
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:20px;
  padding:9px 13px;
  white-space:nowrap;
  cursor:pointer;
}
.chat {
  flex:1;
  overflow-y:auto;
  padding:20px 15px;
}
.welcome {
  text-align:center;
  margin:45px auto 25px;
  max-width:550px;
}
.welcome h1 {font-size:29px;margin-bottom:10px}
.welcome p {color:var(--muted);line-height:1.6}
.message {
  max-width:85%;
  margin:14px 0;
  padding:13px 15px;
  border-radius:15px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user {
  margin-left:auto;
  background:#304b86;
}
.bot {
  margin-right:auto;
  background:var(--panel);
  border:1px solid var(--line);
}
.bot strong {color:#8daaff}
.suggestions {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:20px;
}
.input-area {
  padding:13px;
  background:var(--panel);
  border-top:1px solid var(--line);
}
.input-box {
  display:flex;
  gap:9px;
  max-width:850px;
  margin:auto;
}
textarea {
  flex:1;
  resize:none;
  min-height:48px;
  max-height:130px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  color:white;
  font-size:15px;
  outline:none;
}
.send {
  width:50px;
  border:0;
  border-radius:13px;
  background:var(--accent);
  color:white;
  font-size:21px;
  cursor:pointer;
}
.send:disabled {opacity:.5}
.footer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:9px;
}
button:disabled {cursor:not-allowed;opacity:.6}
@media(max-width:500px) {
  .welcome h1 {font-size:24px}
  .message {max-width:94%}
}
</style>
</head>

  </div>

<div class="topics">

  <button onclick="askTopic('General Science')">🔬 Science</button>
  <button onclick="askTopic('Current Affairs')">📰 Current Affairs</button>
</div>

<main class="chat" id="chat">

    <h1>Welcome to Gem AI 👋</h1>

  </div>
  <div class="footer">
    Gem AI • Powered by Groq • Verify important exam facts with official sources.
  </div>
</div>

</div>
